name: Deploy diary to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare bundled Korean font
        run: |
          mkdir -p assets
          if [ ! -s assets/Gaegu-Regular.ttf ]; then
            curl --fail --location --retry 3 https://raw.githubusercontent.com/google/fonts/16680f8688ffcd467d2eb2146a9ce0343404581d/ofl/gaegu/Gaegu-Regular.ttf -o assets/Gaegu-Regular.ttf
          fi
      - name: Verify layout logic
        run: node --test tests/layout.test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
